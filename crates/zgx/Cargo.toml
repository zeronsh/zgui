[package]
# Integration tests build as a few binaries by area (see AGENTS.md).
autotests = false
name = "zgx"
version.workspace = true
edition.workspace = true
# zgx's code is MIT; the Thai word dictionary in data/ is Unicode's.
license = "MIT AND Unicode-3.0"
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Fine-grained reactive state and a retained, damage-tracked scene: layout, text, input and accessibility for GUIs."
keywords = ["gui", "ui", "reactive", "layout", "accessibility"]
categories = ["gui"]

[dependencies]
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"
# Words in Chinese, Japanese and Thai, which put no spaces between them
# (`cjk-thai-words`).
# The Thai dictionary in data/ is this minor version's (see
# scripts/extract_thai_dictionary.py).
icu_segmenter = { version = "~2.4", default-features = false, features = ["compiled_data"], optional = true }
icu_provider = { version = "~2.4", default-features = false, optional = true }
icu_collections = { version = "~2.4", default-features = false, features = ["alloc"], optional = true }
zerotrie = { version = "0.2.5", default-features = false, optional = true }
zerovec = { version = "0.11.7", default-features = false, optional = true }
# Localized messages' plurals and numbers (`i18n`), and dates
# (`i18n-dates`), by ICU4X's compiled data for every locale.
icu_plurals = { version = "~2.4", default-features = false, features = ["compiled_data"], optional = true }
icu_decimal = { version = "~2.4", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_core = { version = "~2.4", default-features = false, optional = true }
fixed_decimal = { version = "0.7", default-features = false, features = ["ryu"], optional = true }
icu_datetime = { version = "~2.4", default-features = false, features = ["compiled_data"], optional = true }
icu_calendar = { version = "~2.4", default-features = false, features = ["compiled_data"], optional = true }
# Find in page folds accents and composed forms (`find`).
unicode-normalization = "0.1.24"
taffy = { package = "zgx-taffy", version = "=0.9.2", path = "../../vendor/taffy", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size", "calc"] }
stacker = "0.1.25"
smallvec = "1.16"
rustc-hash = "2.1"
foldhash = { version = "0.2", default-features = false }

[features]
default = ["cjk-thai-words"]
# A double click selects a word in Chinese, Japanese and Thai, which put no
# spaces between words, by ICU4X's dictionaries (Chrome's, from ICU): about
# 2.25 MB of a release binary, paged in only when used. Off, those scripts
# select by Unicode's word boundaries (UAX #29): a character at a time.
cjk-thai-words = ["dep:icu_segmenter", "dep:icu_provider", "dep:icu_collections", "dep:zerotrie", "dep:zerovec"]
# Localized messages' plural rules and numbers from ICU4X (`zgx::i18n`);
# without it, plurals follow English and numbers show as Rust writes them.
i18n = ["dep:icu_plurals", "dep:icu_decimal", "dep:icu_locale_core", "dep:fixed_decimal"]
# Localized dates from ICU4X (several MB of data); without it, ISO 8601.
i18n-dates = ["i18n", "dep:icu_datetime", "dep:icu_calendar"]
# `ZGX_PROFILE=1` also times styles and text within their phases: a check
# in every style and text run, so only in builds that ask for it.
profile-nested = []
# Why things ran (`zgx::trace`), for devtools: which writes queued which
# effects, per frame. Off at run time until asked; built only for them.
trace = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"

[[test]]
name = "compose"
path = "tests/compose/main.rs"

[[test]]
name = "editor"
path = "tests/editor/main.rs"

[[test]]
name = "input"
path = "tests/input/main.rs"

[[test]]
name = "layout"
path = "tests/layout/main.rs"

[[test]]
name = "lists"
path = "tests/lists/main.rs"

[[test]]
name = "overlays"
path = "tests/overlays/main.rs"

[[test]]
name = "paint"
path = "tests/paint/main.rs"

[[test]]
name = "text"
path = "tests/text/main.rs"

[[test]]
name = "font_default_allocations"
path = "tests/font_default_allocations.rs"

[[test]]
name = "semantics_text_allocations"
path = "tests/semantics_text_allocations.rs"

[[test]]
name = "env_aliases"
path = "tests/env_aliases.rs"
