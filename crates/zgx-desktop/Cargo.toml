[package]
name = "zgx-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The desktop host for zgx: windows, menus, dialogs, clipboard, IME and accessibility on macOS, Windows and Linux."
keywords = ["gui", "desktop", "winit", "accessibility", "ime"]
categories = ["gui"]

[features]
# Image formats (see zgx-gpu): all by default.
default = ["svg", "png", "jpeg", "gif", "private-api"]
svg = ["zgx-gpu/svg"]
png = ["zgx-gpu/png"]
jpeg = ["zgx-gpu/jpeg"]
gif = ["zgx-gpu/gif"]
# Windows: Vulkan where Direct3D 12 has no adapter (see zgx-gpu).
vulkan = ["zgx-gpu/vulkan"]
# macOS private API, looked up as it is first used and done without where
# it is missing: `CGSMoveWindow` moves a drag preview's window (a sixth of
# what `setFrameOrigin:` costs). Off for App Store builds, which may not
# call private API: build with `default-features = false` and the image
# formats wanted.
private-api = []
# Terminals (`zgx::terminal`) as Ghostty surfaces: builds Ghostty with Zig
# 0.16 (see crates/zgx-ghostty-sys). macOS only for now.
ghostty = ["dep:zgx-ghostty-sys", "zgx-ghostty-sys/link", "dep:libc"]
# The terminal example's interface compiled into it (build.rs), as it ships.
terminal-bundle = ["dep:zgx-script"]
# Web views (`zgx::web_view`) on Windows as WebView2 pages, in a
# DirectComposition tree of the window's own (src/native_host/dcomp.rs and
# webview2.rs).
# Needs the WebView2 runtime, which Windows 11 ships.
webview2 = ["dep:webview2-com", "zgx-gpu/composition", "windows/Win32_Graphics_DirectComposition", "windows/Win32_Graphics_Gdi", "windows/Win32_System_Com", "windows/Win32_System_Com_StructuredStorage", "windows/Win32_System_Ole"]
# mimalloc as the program's allocator, in place of the system's: 1-10%
# fewer cycles in zgx's headless scenes (text 7%, layout 6%, animation
# 9%), for up to 3 MB more resident memory. A program has one allocator:
# leave this off if yours declares a `#[global_allocator]`.
mimalloc = ["dep:mimalloc"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.0" }
mimalloc = { version = "0.1", default-features = false, optional = true }
zgx-gpu = { path = "../zgx-gpu", version = "0.1.0", default-features = false }
winit = "0.30.13"
softbuffer = "0.4.8"
fontdue = "0.9.3"
cosmic-text = { package = "zgx-cosmic-text", version = "0.19.1", path = "../../vendor/cosmic-text" }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
accesskit = "0.24.1"
unicode-segmentation = "1.12"
accesskit_winit = "0.33.2"
rfd = "=0.17.2"
open = "=5.4.4"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "=0.9.12"
dbus-crossroads = "=0.5.3"
calloop = "=0.14.4"
calloop-wayland-source = "=0.4.1"
wayland-client = "=0.31.15"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable", "staging"] }
# The spelling checker (linux_spelling.rs): Enchant, loaded when an editor
# first checks.
libloading = "0.8"
# D-Bus threads that sleep until a message or their stop (linux_dbus.rs).
libc = "0.2"
# zbus's thread pool (accesskit's AT-SPI): 1.7.0's idle thread never ends
# and wakes twice a second (smol-rs/blocking#75); 1.6's ends after 500 ms.
blocking = "=1.6.2"
# A new window's work area on X11 (x11_work_area.rs); winit's version.
x11rb = "0.13"
# An X11 input method's spot sent at once (x11_nudge.rs); winit's version.
x11-dl = "2.21"

# The compositor clock (frame_source.rs) and window chrome (window_chrome.rs);
# the version wgpu-hal uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Wdk_System_SystemServices", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "UI_ViewManagement"] }
webview2-com = { version = "0.39", optional = true }
# A drag handed to Windows (src/native_drag.rs) is a COM drop source.
windows-core = "0.62"
# Popup windows draw into DirectComposition visuals (src/popup_window/win32.rs).
zgx-gpu = { path = "../zgx-gpu", version = "0.1.0", default-features = false, features = ["composition"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.18.0", default-features = false }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSTextInputContext", "NSColor", "NSGraphics", "NSEvent", "objc2-core-foundation", "objc2-quartz-core", "block2", "NSTextInputClient", "NSTrackingArea", "NSCursor", "NSPasteboard", "NSGraphicsContext", "NSScreen", "NSVisualEffectView", "NSColorSpace", "NSControl", "NSScroller", "NSWorkspace", "NSAccessibility", "NSSpellChecker", "NSPanel", "NSBezierPath", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "NSDictionary", "NSError", "NSURLRequest", "NSUUID", "NSKeyValueObserving", "NSValue", "NSData", "NSJSONSerialization", "NSGeometry", "objc2-core-foundation", "NSAttributedString", "NSRange", "NSURLResponse", "NSNotification", "NSOperation", "block2", "NSOrthography", "NSTextCheckingResult", "NSLocale"] }
zgx-ghostty-sys = { path = "../zgx-ghostty-sys", version = "0.1.0", optional = true }
libc = { version = "0.2", optional = true }
# Native views over zgx (src/native_host): web pages, clipping masks, backdrops.
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKBackForwardList", "WKBackForwardListItem", "WKNavigationDelegate", "WKNavigation", "WKNavigationAction", "WKNavigationResponse", "WKWebsiteDataStore", "WKUserContentController", "WKUserScript", "WKScriptMessageHandler", "WKScriptMessage", "WKUIDelegate", "WKWindowFeatures", "WKFrameInfo", "WKSecurityOrigin", "WKPreferences", "WKURLSchemeHandler", "WKURLSchemeTask"] }
# Answers custom-scheme requests on the main queue, from whatever thread served them.
dispatch2 = "0.3"
block2 = "0.6"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPath", "CGColor", "CGAffineTransform"] }

[[example]]
name = "ghostty_pane"
required-features = ["ghostty"]

[[example]]
name = "terminal"
required-features = ["ghostty"]

[build-dependencies]
# `terminal-bundle`: compiles the terminal example's scripts (build.rs).
zgx-script = { path = "../zgx-script", version = "0.1.0", optional = true }

[dev-dependencies]
# The components the Linux probe's example shows (`components_probe`).
zgx-components = { path = "../zgx-components" }
accesskit_consumer = "0.38.0"
# The terminal example's interface is a Luau script. Image formats come
# through this crate's own features.
zgx-script = { path = "../zgx-script", default-features = false }
# The script examples' menus (`zgx_run::menus`). Without its default
# features: its `mimalloc` would turn on this crate's for every example
# and test (features unify), the comparison workloads included.
zgx-run = { path = "../zgx-run", default-features = false }
# The benchmark workloads the examples run.
zgx-workload = { path = "../../comparisons/workload" }
# The terminal example's session server keeps each shell's screen to redraw
# it for a new window.
vt100 = "0.16"
# The zeron example: a client of Zeron's local engine WebSocket.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# What AT-SPI reads of zgx's tree (accessibility.rs): the vendored adapter,
# which accesskit_unix builds on.
accesskit_atspi_common = "0.19.1"
# The icon theme test's PNGs (linux_icon.rs); zgx-gpu's version.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
