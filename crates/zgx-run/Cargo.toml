[package]
name = "zgx-run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["gui", "luau", "hot-reload", "desktop"]
categories = ["gui", "command-line-utilities"]
description = "Run a zgx Luau script as a desktop app, with hot reload: `zgx-run app/`."

[features]
# mimalloc as the runner's allocator (zgx-desktop's `mimalloc`): 6-10%
# less CPU for script, text and layout work, for about 2 MB more memory.
# `--no-default-features` keeps the system's.
default = ["mimalloc", "inspect", "fetch", "socket", "scene3d", "i18n", "gltf", "webkitgtk"]
mimalloc = ["zgx-desktop/mimalloc"]
# Devtools for agents (`zgx run --inspect`, `zgx inspect`): a user-only
# local socket a running app answers on, when asked. A build for shipping
# leaves it out (`--no-default-features --features mimalloc`): then nothing
# can drive the app, whatever its environment says.
inspect = ["zgx-script/inspect"]
# A fetcher for `ui.fetch` and remote images (`zgx_run::install_fetcher`):
# HTTP and HTTPS through ureq, TLS by rustls (no OpenSSL) with Mozilla's
# roots. An app that brings its own transport, or none, leaves it out
# (`--no-default-features`) and with it ureq, rustls and ring.
fetch = ["dep:ureq"]
# A connector for `ui.socket` (`zgx_run::install_connector`): WebSockets,
# `ws://` and `wss://`, TLS by rustls with Mozilla's roots, each connection
# on a thread of its own that sleeps until the network or the script wakes
# it. Without it, `ui.socket` stays closed unless the host brings a
# connector of its own.
socket = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots", "dep:polling"]
# `ui.scene3d` (zgx-script's `scene3d`): 3D scenes, drawn with zgx-3d.
scene3d = ["zgx-script/scene3d"]
# Localized messages' plural rules and numbers for every locale
# (zgx-script's `i18n`, about 90 KB).
i18n = ["zgx-script/i18n"]
# `ui.webview` on Linux (zgx-desktop's `webkitgtk`): WebKitGTK 4.1 pages,
# the library opened as a page is first shown; where it is missing pages are
# placeholders. Nothing elsewhere.
webkitgtk = ["zgx-desktop/webkitgtk"]
# `ui.model` (zgx-script's `gltf`): glTF models in 3D scenes. 48.5 KiB
# of a build for shipping (`dist`, on against off at one commit).
gltf = ["zgx-script/gltf"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.6", default-features = false }
zgx-desktop = { path = "../zgx-desktop", version = "0.1.6" }
zgx-script = { path = "../zgx-script", version = "0.1.6" }
serde_json = "1"
# `~3.5`: the fetcher's connector uses `ureq::unversioned`, which a minor
# release may change.
ureq = { version = "~3.5", default-features = false, features = ["rustls", "gzip"], optional = true }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
polling = { version = "3", optional = true }

[dev-dependencies]
# Reading devtools' snapshots back.
png = "0.18"

[[bin]]
name = "zgx-run"
path = "src/main.rs"
