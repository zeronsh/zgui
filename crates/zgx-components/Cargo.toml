[package]
# Integration tests build as one binary (see AGENTS.md).
autotests = false
name = "zgx-components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "zgx's component library: data grid, tree view, dates and times, combobox, select, tabs, toasts, command palette and controls, built on zgx's public API."
keywords = ["gui", "ui", "components", "accessibility", "widgets"]
categories = ["gui"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.6", default-features = false }

[dev-dependencies]
# The catalogue example's window.
zgx-desktop = { path = "../zgx-desktop" }

[[test]]
name = "components"
path = "tests/components/main.rs"
