[package]
name = "zgx-3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "Retained 3D scenes for zgx: meshes, a camera, lights and a PBR material, drawn in a GPU view only when they change."
keywords = ["gui", "3d", "wgpu", "pbr", "zgx"]
categories = ["gui", "rendering"]

[dependencies]
zgx = { path = "../zgx", version = "0.1.6", default-features = false }
zgx-gpu = { path = "../zgx-gpu", version = "0.1.6", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
serde_json = { version = "1", optional = true }

[features]
# glTF 2.0 models (`Model`, `World::add_model`): `.glb` and `.gltf` files,
# their textures PNG or JPEG.
gltf = ["dep:serde_json", "zgx-gpu/png", "zgx-gpu/jpeg"]

[dev-dependencies]
zgx-desktop = { path = "../zgx-desktop", default-features = false }

[[example]]
name = "model"
required-features = ["gltf"]
