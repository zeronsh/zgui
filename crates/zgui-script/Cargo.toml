[package]
# Integration tests build as a few binaries by area (see AGENTS.md).
autotests = false
name = "zgui-script"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["gui", "luau", "scripting", "hot-reload", "ui"]
categories = ["gui", "development-tools"]
description = "Luau scripts that describe zgui component trees, with hot reload."

[features]
# Image formats (see zgui-gpu): all by default.
default = ["svg", "png", "jpeg", "gif"]
svg = ["zgui-gpu/svg"]
png = ["zgui-gpu/png"]
jpeg = ["zgui-gpu/jpeg"]
gif = ["zgui-gpu/gif"]

[dependencies]
zgui = { path = "../zgui", version = "0.1.0" }
# Image decoding for `ui.image` (PNG, JPEG).
zgui-gpu = { path = "../zgui-gpu", version = "0.1.0", default-features = false }
mlua = { version = "0.12.2", features = ["luau"] }
# `.luaurc` aliases for `require("@alias/...")`.
serde_json = "1"
# Markdown for `ui.markdown` and `zgui_script::markdown`.
pulldown-cmark = { version = "0.13", default-features = false }
smallvec = "1.16"

# The script time budget counts the thread's CPU time (clock_gettime).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[bin]]
# `zgui check app.luau`: type checks scripts with luau-lsp (src/check.rs).
name = "zgui"
path = "src/bin/zgui.rs"
# Its docs would land where the zgui library's do.
doc = false

# Named apart from zgui-gpu's `layout_bench` and zgui-desktop's `web_view`:
# examples share one output directory, and Windows cannot link two
# executables (and their .pdb) to one path at once.
[[example]]
name = "script_layout_bench"
path = "examples/layout_bench.rs"

[[example]]
name = "script_web_view"
path = "examples/web_view.rs"

[dev-dependencies]
zgui-desktop = { path = "../zgui-desktop" }

[[test]]
name = "anime"
path = "tests/anime/main.rs"

[[test]]
name = "examples"
path = "tests/examples/main.rs"

[[test]]
name = "state"
path = "tests/state/main.rs"

[[test]]
name = "tooling"
path = "tests/tooling/main.rs"

[[test]]
name = "ui"
path = "tests/ui/main.rs"

[[test]]
name = "bundle"
path = "tests/bundle.rs"
