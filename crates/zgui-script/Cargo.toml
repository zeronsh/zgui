[package]
name = "zgui-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Luau scripts that describe zgui component trees, with hot reload."

[dependencies]
zgui = { path = "../zgui" }
# Image decoding for `ui.image` (PNG, JPEG).
zgui-gpu = { path = "../zgui-gpu" }
mlua = { version = "0.12.2", features = ["luau"] }
# `.luaurc` aliases for `require("@alias/...")`.
serde_json = "1"
# Markdown for `ui.markdown` and `zgui_script::markdown`.
pulldown-cmark = { version = "0.13", default-features = false }

# The script time budget counts the thread's CPU time (clock_gettime).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
# `zgui check app.luau`: type checks scripts with luau-lsp (src/check.rs).
name = "zgui"
path = "src/bin/zgui.rs"

# Named apart from zgui-gpu's `layout_bench` and zgui-desktop's `web_view`:
# examples share one output directory, and Windows cannot link two
# executables (and their .pdb) to one path at once.
[[example]]
name = "script_layout_bench"
path = "examples/layout_bench.rs"

[[example]]
name = "script_web_view"
path = "examples/web_view.rs"

[dev-dependencies]
zgui-desktop = { path = "../zgui-desktop" }
