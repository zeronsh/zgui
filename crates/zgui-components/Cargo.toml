[package]
# Integration tests build as one binary (see AGENTS.md).
autotests = false
name = "zgui-components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "zgui's component library: data grid, tree view, dates and times, combobox, select, tabs, toasts, command palette and controls, built on zgui's public API."
keywords = ["gui", "ui", "components", "accessibility", "widgets"]
categories = ["gui"]

[dependencies]
zgui = { path = "../zgui", version = "0.1.0" }

[dev-dependencies]
# The catalogue example's window.
zgui-desktop = { path = "../zgui-desktop" }

[[test]]
name = "components"
path = "tests/components/main.rs"
