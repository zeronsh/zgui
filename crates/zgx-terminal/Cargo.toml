[package]
name = "zgx-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["terminal", "pty", "conpty", "gui", "zgx"]
categories = ["gui", "command-line-interface"]
description = "Terminal sessions for zgx: a shell on a pseudoterminal (openpty, ConPTY) and its screen, kept by alacritty_terminal."

[dependencies]
zgx = { path = "../zgx", version = "0.1.7", default-features = false }
# The screen model: the VT parser, grid, scrollback, selection and modes,
# and the pseudoterminals (openpty on Unix, ConPTY on Windows).
alacritty_terminal = { package = "zgx-alacritty-terminal", version = "=0.26.0", path = "../../vendor/alacritty-terminal", default-features = false }
# The session's I/O thread sleeps in it until the shell writes or the app does.
polling = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The shell's foreground descendant (Toolhelp snapshots), and Ctrl+C handling
# restored for it.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }
