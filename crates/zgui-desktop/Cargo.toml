[package]
name = "zgui-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Image formats (see zgui-gpu): all by default.
default = ["svg", "png", "jpeg", "gif"]
svg = ["zgui-gpu/svg"]
png = ["zgui-gpu/png"]
jpeg = ["zgui-gpu/jpeg"]
gif = ["zgui-gpu/gif"]
# Terminals (`zgui::terminal`) as Ghostty surfaces: builds Ghostty with Zig
# 0.16 (see crates/zgui-ghostty-sys). macOS only for now.
ghostty = ["dep:zgui-ghostty-sys", "zgui-ghostty-sys/link", "dep:libc"]
# The terminal example's interface compiled into it (build.rs), as it ships.
terminal-bundle = ["dep:zgui-script"]
# Web views (`zgui::web_view`) on Windows as WebView2 pages, in a
# DirectComposition tree of the window's own (src/native_host/dcomp.rs and
# webview2.rs).
# Needs the WebView2 runtime, which Windows 11 ships.
webview2 = ["dep:webview2-com", "zgui-gpu/composition", "windows/Win32_Graphics_DirectComposition", "windows/Win32_Graphics_Gdi", "windows/Win32_System_Com", "windows/Win32_System_Com_StructuredStorage", "windows/Win32_System_Ole"]

[dependencies]
zgui = { path = "../zgui" }
zgui-gpu = { path = "../zgui-gpu", default-features = false }
winit = "0.30.13"
softbuffer = "0.4.8"
fontdue = "0.9.3"
cosmic-text = "0.19.0"
arboard = { version = "3.6.1", default-features = false }
accesskit = "0.24.1"
unicode-segmentation = "1.12"
accesskit_winit = "0.33.2"
rfd = "=0.17.2"
open = "=5.4.4"
zgui-workload = { path = "../../comparisons/workload" }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "=0.9.12"
dbus-crossroads = "=0.5.3"
calloop = "=0.14.4"
calloop-wayland-source = "=0.4.1"
wayland-client = "=0.31.15"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
# The spelling checker (linux_spelling.rs): Enchant, loaded when an editor
# first checks.
libloading = "0.8"

# The compositor clock (frame_source.rs) and window chrome (window_chrome.rs);
# the version wgpu-hal uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Wdk_System_SystemServices", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "UI_ViewManagement"] }
webview2-com = { version = "0.39", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.18.0", default-features = false }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSTextInputContext", "NSColor", "NSGraphics", "NSEvent", "objc2-core-foundation", "objc2-quartz-core", "block2", "NSTextInputClient", "NSTrackingArea", "NSCursor", "NSPasteboard", "NSGraphicsContext", "NSScreen", "NSVisualEffectView", "NSColorSpace", "NSControl", "NSScroller", "NSWorkspace", "NSAccessibility", "NSSpellChecker"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "NSDictionary", "NSError", "NSURLRequest", "NSUUID", "NSKeyValueObserving", "NSValue", "NSData", "NSJSONSerialization", "NSGeometry", "objc2-core-foundation", "NSAttributedString", "NSRange", "NSURLResponse", "NSNotification", "NSOperation", "block2", "NSOrthography", "NSTextCheckingResult"] }
zgui-ghostty-sys = { path = "../zgui-ghostty-sys", optional = true }
libc = { version = "0.2", optional = true }
# Native views over zgui (src/native_host): web pages, clipping masks, backdrops.
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKBackForwardList", "WKBackForwardListItem", "WKNavigationDelegate", "WKNavigation", "WKNavigationAction", "WKNavigationResponse", "WKWebsiteDataStore", "WKUserContentController", "WKUserScript", "WKScriptMessageHandler", "WKScriptMessage", "WKUIDelegate", "WKWindowFeatures", "WKFrameInfo", "WKSecurityOrigin", "WKPreferences", "WKURLSchemeHandler", "WKURLSchemeTask"] }
# Answers custom-scheme requests on the main queue, from whatever thread served them.
dispatch2 = "0.3"
block2 = "0.6"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGPath", "CGColor", "CGAffineTransform"] }

[[bin]]
name = "zgui-demo"
path = "src/main.rs"

[[example]]
name = "ghostty_pane"
required-features = ["ghostty"]

[[example]]
name = "terminal"
required-features = ["ghostty"]

[build-dependencies]
# `terminal-bundle`: compiles the terminal example's scripts (build.rs).
zgui-script = { path = "../zgui-script", optional = true }

[dev-dependencies]
accesskit_consumer = "0.38.0"
# The terminal example's interface is a Luau script. Image formats come
# through this crate's own features.
zgui-script = { path = "../zgui-script", default-features = false }
# The script examples' menus (`zgui_run::menus`).
zgui-run = { path = "../zgui-run" }
# The terminal example's session server keeps each shell's screen to redraw
# it for a new window.
vt100 = "0.16"
# The zeron example: a client of Zeron's local engine WebSocket.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
