name: Rust
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!site/**"
      - "!**/*.md"
      # Markdown compiled as doctests.
      - "README.md"
      - "docs/composition.md"
      - "docs/styling.md"
      - "docs/window-controls.md"
  pull_request:
    paths:
      - "**"
      - "!site/**"
      - "!**/*.md"
      # Markdown compiled as doctests.
      - "README.md"
      - "docs/composition.md"
      - "docs/styling.md"
      - "docs/window-controls.md"
# A newer push to a PR supersedes its running check. On main every run
# finishes (a full signal per commit, and the caches it saves); a newer
# push waits, replacing any run still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Dozens of desktop fixtures link the renderer; keep runner disk bounded.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  # Checks, unit tests, Vulkan rendering and every native Linux probe in one
  # job: the examples the tests build are the probes' fixtures.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Ubuntu mirrors are sometimes very slow; reuse last month's .debs.
      - id: apt-key
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ~/apt-archives
          key: apt-${{ runner.arch }}-${{ steps.apt-key.outputs.month }}-${{ hashFiles('.github/linux-packages.txt') }}
      - name: Linux packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ -d ~/apt-archives ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $(grep -v '^#' .github/linux-packages.txt)
          mkdir -p ~/apt-archives && cp /var/cache/apt/archives/*.deb ~/apt-archives/
      - uses: actions/cache/save@v4
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Benchmark sampler failure evidence
        run: python3 scripts/test_compare.py -v
      - run: cargo fmt --all -- --check
      # Luau scripts, as stylua.toml and .styluaignore have them.
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check crates/zgui-script
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p zgui -p zgui-desktop -p zgui-workload -p zgui-script --all-targets --locked
      - run: cargo test --workspace --doc --locked
      # Concurrent device tests need Vulkan-Loader#1866; older distro loaders
      # can crash inside vkSetDebugUtilsObjectNameEXT. Keep debug/validation on.
      - name: Build private patched Vulkan loader
        if: ${{ !cancelled() }}
        run: |
          scripts/build_vulkan_loader.sh "$RUNNER_TEMP/zgui-vulkan-loader"
          printf 'LD_LIBRARY_PATH=%s/build/loader\n' "$RUNNER_TEMP/zgui-vulkan-loader" >> "$GITHUB_ENV"
      - name: Vulkan rendering and damage readback
        if: ${{ !cancelled() }}
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          set -o pipefail
          cargo test -p zgui-gpu --locked 2>&1 | tee "$RUNNER_TEMP/zgui-vulkan-tests.log"
      - name: Build native fixtures
        id: native-fixtures
        if: ${{ !cancelled() }}
        run: |
          cargo build -p zgui-desktop --examples --locked
          cargo test -p zgui-desktop --lib --no-run --locked
      # X11, Wayland, IME, clipboard, DPI, accessibility and input probes. Each
      # owns its display or compositor, so they run side by side; every probe
      # runs and reports even after another fails.
      - name: Native Linux probes
        if: ${{ !cancelled() && steps.native-fixtures.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 scripts/linux_smokes.py --jobs 4
      - name: Preserve Vulkan and native window evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: linux-evidence
          path: |
            ${{ runner.temp }}/zgui-vulkan-tests.log
            /tmp/zgui-*
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p zgui -p zgui-desktop -p zgui-workload --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Metal rendering and damage readback
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/macos_native_validation.py --target-dir target --output "$RUNNER_TEMP/zgui-macos-parity" 2>&1 | tee "$RUNNER_TEMP/zgui-metal-tests.log"
      - name: Native component window lifecycle
        if: ${{ !cancelled() }}
        run: |
          cargo build -p zgui-desktop --example component_workload --locked
          python3 scripts/component_host_smoke.py target/debug/examples/component_workload --output "$RUNNER_TEMP/zgui-macos-host"
      # Keep textual diagnostics even if account artifact storage is exhausted.
      - name: Print Metal validation diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          paths = sorted(path for directory in ("zgui-macos-parity", "zgui-macos-host")
                         for path in (root / directory).rglob("*"))
          for path in paths:
              if path.is_file() and path.suffix in (".log", ".json") and path.name not in ("source-diff.log", "source-files.json"):
                  print(f"::group::{path.name}", flush=True)
                  print(path.read_text(errors="replace"), flush=True)
                  print("::endgroup::", flush=True)
          PY
      - name: Preserve Metal and window evidence
        id: macos-evidence-upload
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: macos-gpu-evidence
          path: |
            ${{ runner.temp }}/zgui-metal-tests.log
            ${{ runner.temp }}/zgui-macos-host
            ${{ runner.temp }}/zgui-macos-parity
      - name: Report incomplete Metal artifact upload
        if: always() && steps.macos-evidence-upload.outcome == 'failure'
        run: echo "::warning::Metal artifact upload failed. Text diagnostics remain in job logs; downloadable evidence preservation is incomplete (check artifact quota). This is not native validation completion."
  # Compile everything and run the core unit tests; native Windows probes and
  # the GPU suite run on developer machines.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p zgui -p zgui-desktop --lib --locked
      # Bundled script paths: caught a Windows separator bug.
      - run: cargo test -p zgui-script --test bundle --locked
      # Direct3D 12 on WARP (no GPU on the runner): pixel tests of what the
      # D3D shader compiler alone gets wrong (coarse derivatives, #38).
      - run: cargo test -p zgui-gpu --test borders --test transforms --test rounded_clip --locked
