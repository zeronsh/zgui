# A release's checks, publishing nothing: on a version tag (`v0.1.0`), or by
# hand, every published crate (zgx's own and its forks) is packaged and built
# from its package against crates.io, without the workspace's [patch]
# section, as an app depending on zgx builds it, on each platform (each has
# fallbacks of its own: Wayland popups, Direct3D 12 adapters). Nothing is
# uploaded. scripts/release_check.sh; see docs/releasing.md. Not run on pull
# requests: CI's time is unchanged.
name: Release dry run

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get update -qq $apt
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $apt $(grep -v '^#' .github/linux-packages.txt)
      - uses: Swatinem/rust-cache@v2
      # macOS's terminals build Ghostty with Zig 0.16, as a user's build does
      # (zgx-ghostty-sys), and the check builds every feature its platform has.
      # Windows and Linux draw theirs with zgx-terminal, which needs no Zig.
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'macOS'
        with:
          version: 0.16.0
      - name: The tag is the workspace's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version, the workspace's version" >&2
            exit 1
          fi
      - name: Package and build every published crate as crates.io will (no upload)
        run: scripts/release_check.sh
