[workspace]
members = ["crates/zgui", "crates/zgui-desktop", "crates/zgui-ghostty-sys", "crates/zgui-gpu", "crates/zgui-script", "crates/zgui-run", "comparisons/workload"]
exclude = [
    "comparisons/gpui",
    "comparisons/quickgui",
    "vendor/accesskit_macos",
    "vendor/cosmic-text",
    "vendor/taffy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Dependencies optimized in dev builds too: the Luau VM, text shaping,
# rasterizing and the GPU stack run many times slower unoptimized, which
# made debug apps lag. Workspace crates stay quick to rebuild. Their debug
# info is line tables only (backtraces keep files and lines): full debug
# info for optimized code was a tenth of a clean build's CPU.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# The shader compiler runs once per pipeline, at startup: optimized less, it
# compiles in less time on a clean build's critical path, and a debug app's
# renderer starts as fast (21-24 ms either way).
[profile.dev.package.naga]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

# wgpu-hal with a Metal backend patch: command buffers are created lazily and
# empty ones are never committed. Upstream opens several per submission; each
# costs a commit, a completion callback and Core Animation frame-pacing IPC.
# See vendor/wgpu-hal/ZGUI_PATCH.md.
#
# cosmic-text with a shaping patch: cached words are looked up without building
# a key per word, and plain ASCII lines skip bidi analysis. Text shaping is the
# largest share of CPU when text streams. See vendor/cosmic-text/ZGUI_PATCH.md.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
cosmic-text = { path = "vendor/cosmic-text" }
# taffy 0.9.0 with auto margins keeping a flex line's gaps (see
# vendor/taffy/src/compute/flexbox.rs, "zgui:").
taffy = { path = "vendor/taffy" }
# AccessKit 0.26 on macOS with headings VoiceOver finds: see
# vendor/accesskit_macos/ZGUI_PATCH.md.
accesskit_macos = { path = "vendor/accesskit_macos" }
