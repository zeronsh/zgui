[package]
name = "zgx-compare-quickgui"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
quickgui = { git = "https://github.com/egoist/quickgui", rev = "811d6e2816d5229711f59683c4c9dfbb6fc74133", default-features = false }
zgx-workload = { path = "../workload" }
[profile.release]
lto = "thin"
codegen-units = 1

# As zgx's: the comparison tables build every framework with it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
