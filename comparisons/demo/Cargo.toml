[package]
# The direct retained-scene benchmark host (docs/benchmarking.md): built as
# `target/release/zgx-demo` with `cargo build --release -p zgx-demo`.
name = "zgx-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zgx = { path = "../../crates/zgx" }
zgx-desktop = { path = "../../crates/zgx-desktop" }
zgx-gpu = { path = "../../crates/zgx-gpu", default-features = false }
zgx-workload = { path = "../workload" }
winit = "0.30.13"
softbuffer = "0.4.8"
